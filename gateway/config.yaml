# LiteLLM model routing — OpenAI-compatible upstream over HTTPS
# UPSTREAM_API_BASE / UPSTREAM_API_KEY come from the container environment (.env)
model_list:
  - model_name: Qwen/Qwen3.8-27B-FP8
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B-FP8
      api_base: os.environ/UPSTREAM_API_BASE
      api_key: os.environ/UPSTREAM_API_KEY

litellm_settings:
  drop_params: true
