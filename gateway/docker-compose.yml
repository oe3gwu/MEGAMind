# LiteLLM HTTP gateway for MEGAMind (MEGA65 / Mega-IP)
# HTTP only on the LAN side — Mega-IP has no TLS.
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-retrosystem}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY}
      - UPSTREAM_API_BASE=${UPSTREAM_API_BASE}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
